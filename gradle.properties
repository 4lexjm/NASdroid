# MaxMetaspaceSize is a workaround for https://github.com/gradle/gradle/issues/19750
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options="-Xmx1536m"
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
